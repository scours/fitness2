<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/fitness/lectures/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <title>Verify Certificate Authenticity</title>
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness.css" rel="stylesheet">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness2.css" rel="stylesheet">
  <style>
    /* body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    } */

    .container {
      max-width: 600px;
      text-align: center;
      height: 50vh;
    }

    .authentic-message {
      font-size: 1.2em;
      color: green;
      font-weight: bold;
    }

    .error-message {
      font-size: 1.2em;
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main-header></main-header>
  <div class="wrapper">
    <div class="container">
      <h2>Certificate Verification</h2>
      <p id="verificationMessage" class="authentic-message">Loading...</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const encodedCertificateInfo = urlParams.get("data");

      if (encodedCertificateInfo) {
        try {
          const certificateInfo = JSON.parse(LZString.decompressFromEncodedURIComponent(encodedCertificateInfo));
          const {
            firstName,
            lastName,
            pathway,
            certificationDate
          } = certificateInfo;

          document.getElementById("verificationMessage").textContent =
            `This certificate is authentic and valid. It has been attributed to ${firstName} ${lastName} on ${certificationDate} for the following pathway: ${pathway}.`;
        } catch (error) {
          console.error("Decoding error:", error);
          document.getElementById("verificationMessage").textContent = "Invalid certificate data.";
          document.getElementById("verificationMessage").className = "error-message";
        }
      } else {
        document.getElementById("verificationMessage").textContent = "No certificate data found in URL.";
        document.getElementById("verificationMessage").className = "error-message";
      }
    });
  </script>
  <main-footer></main-footer>

  <link rel="stylesheet" href="modifyLectures/assets/bootstrap/css/bootstrap.min.css" />
  <script src="src/js/google_translate_plugin.js"></script>
  <script src="src/js/header.js"></script>
  <script src="src/js/footer.js"></script>
</body>

</html>
