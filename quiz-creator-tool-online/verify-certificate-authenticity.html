<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/fitness/lectures/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <title>Verify Certificate Authenticity</title>
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness.css" rel="stylesheet">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness2.css" rel="stylesheet">
  <style>
    /* Center container and style message box */
    .container {
      max-width: 600px;
      text-align: center;
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message-box {
      border: 5px solid;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      text-align: left;
      margin: 0 auto;
      font-size: 1em;
      line-height: 1.6;
    }

    .valid-message {
      border-color: green;
    }

    .error-message {
      border-color: red;
      color: red;
    }

    .centered-text {
      text-align: center;
      font-weight: bold;
    }

    .clickable-link {
      color: blue;
      text-decoration: underline;
    }

    h2 {
      text-align: center;
      font-size: 1.5em;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <main-header></main-header>
  <h2>Certificate Verification</h2>
  <div class="wrapper">
    <div class="container">
      <div id="messageBox" class="message-box">
        <p id="verificationMessage" class="centered-text">Loading...</p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const encodedCertificateInfo = urlParams.get("data");

      const pathwayUrls = {
        "R&D_Manager_Basic": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#research-development-basic",
        "R&D_Manager_Advanced": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#research-development-advanced",
        "Quality_Manager_Basic": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#quality-managers-basic",
        "Quality_Manager_Advanced": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#quality-managers-advanced",
        "Production_Line_Worker_Basic": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#production-line-workers-basic",
        "Production_Manager_Basic": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#production-managers-basic",
        "Production_Manager_Advanced": "https://fitness.agroparistech.fr/fitness2/lectures/lectures-pathways.html#production-managers-advanced"
      };

      if (encodedCertificateInfo) {
        try {
          const certificateInfo = JSON.parse(LZString.decompressFromEncodedURIComponent(encodedCertificateInfo));
          const {
            firstName,
            lastName,
            pathway,
            certificationDate,
            pathwayValue
          } = certificateInfo;
          const pathwayUrl = pathwayUrls[pathwayValue];

          const messageContent = `
    <p class="centered-text">This certificate is authentic and valid.</p>
    <p>It has been attributed to <strong>${firstName} ${lastName}</strong> for the pathway: <strong>${pathway}</strong>.
    </p>
    <p>Certification Date: <strong>${certificationDate}</strong></p>`;

          document.getElementById("verificationMessage").innerHTML = messageContent;

          if (pathwayUrl) {
            const linkElement = document.createElement("a");
            linkElement.href = pathwayUrl;
            linkElement.target = "_blank";
            linkElement.className = "clickable-link";
            linkElement.textContent = "For more details on the certified pathway, click here.";

            const linkParagraph = document.createElement("p");
            linkParagraph.appendChild(linkElement);
            document.getElementById("verificationMessage").appendChild(linkParagraph);
          }

          // Add the valid-message class to make the border green
          document.getElementById("messageBox").classList.add("valid-message");
          document.getElementById("messageBox").classList.remove("error-message");

        } catch (error) {
          console.error("Decoding error:", error);
          document.getElementById("verificationMessage").textContent = "Invalid certificate data.";
          document.getElementById("messageBox").classList.add("error-message");
          document.getElementById("messageBox").classList.remove("valid-message");
        }
      } else {
        document.getElementById("verificationMessage").textContent = "No certificate data found in URL.";
        document.getElementById("messageBox").classList.add("error-message");
        document.getElementById("messageBox").classList.remove("valid-message");
      }
    });
  </script>
  <main-footer></main-footer>

  <link rel="stylesheet" href="modifyLectures/assets/bootstrap/css/bootstrap.min.css" />
  <script src="src/js/google_translate_plugin.js"></script>
  <script src="src/js/header.js"></script>
  <script src="src/js/footer.js"></script>
</body>

</html>
