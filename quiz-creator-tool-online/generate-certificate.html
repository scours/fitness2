<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Certificate</title>
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness.css" rel="stylesheet">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness2.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    .certificate-container {
      width: 90%;
      max-width: 600px;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .certificate-container h2 {
      color: #4caf50;
      margin-bottom: 10px;
    }

    .input-group {
      margin: 20px 0;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
      text-align: left;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    .info-text {
      margin-top: 20px;
      color: #555;
      font-size: 1.1em;
      line-height: 1.5em;
    }

    .info-highlight {
      color: #00796b;
      font-weight: bold;
    }

    .generate-btn {
      background-color: #4caf50;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.3s;
      width: 100%;
      max-width: 200px;
      margin-top: 20px;
    }

    .generate-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <div class="certificate-container">
    <h2>Generate Certificate</h2>

    <div class="input-group">
      <label for="encodedDataInput">Encoded Profile Data:</label>
      <input type="text" id="encodedDataInput" placeholder="Paste the encoded data here">
    </div>

    <button class="generate-btn" onclick="loadProfileData()">Load Profile Info</button>

    <div class="info-text" id="profileInfo" style="display: none;">
      <p>The generated certificate will be for:</p>
      <p>First Name: <span class="info-highlight" id="firstName"></span></p>
      <p>Last Name: <span class="info-highlight" id="lastName"></span></p>
      <p>Email: <span class="info-highlight" id="email"></span></p>

      <div class="input-group">
        <label for="pathwaySelect">Select Pathway:</label>
        <select id="pathwaySelect">
          <option value="R&D_Manager_Basic">Research and Development Managers in Food Packaging (Basic)</option>
          <option value="R&D_Manager_Advanced">Research and Development Managers in Food Packaging (Advanced)</option>
          <option value="Quality_Manager_Basic">Quality Managers in Food Packaging (Basic)</option>
          <option value="Quality_Manager_Advanced">Quality Managers in Food Packaging (Advanced)</option>
          <option value="Production_Line_Worker_Basic">Packaging Production Line Workers (Basic)</option>
          <option value="Production_Manager_Basic">Packaging Production Managers (Basic)</option>
          <option value="Production_Manager_Advanced">Packaging Production Managers (Advanced)</option>
        </select>
      </div>

      <button class="generate-btn" onclick="generateCertificate()">Generate Certificate</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blob-stream/0.1.3/blob-stream.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>


  <script>
    function loadProfileData() {
      const encodedProfileInfo = document.getElementById('encodedDataInput').value.trim();
      console.log("Encoded Profile Info:", encodedProfileInfo);

      if (encodedProfileInfo) {
        try {
          const profileInfo = JSON.parse(LZString.decompressFromEncodedURIComponent(encodedProfileInfo));
          document.getElementById('firstName').textContent = profileInfo.firstName || 'N/A';
          document.getElementById('lastName').textContent = profileInfo.lastName || 'N/A';
          document.getElementById('email').textContent = profileInfo.email || 'N/A';
          document.getElementById('profileInfo').style.display = 'block';
        } catch (error) {
          alert("Failed to decode the profile data. Please ensure it is valid encoded data.");
          console.error("Decoding error:", error);
        }
      } else {
        alert("Please enter the encoded profile data.");
      }
    }

    async function generateCertificate() {
      const firstName = document.getElementById('firstName').textContent;
      const lastName = document.getElementById('lastName').textContent;
      const selectedPathwayText = document.getElementById('pathwaySelect').selectedOptions[0].textContent;
      const certificationDate = new Date().toLocaleDateString();

      // Encode certificate information for verification link
      const certificateInfo = {
        firstName: firstName,
        lastName: lastName,
        pathway: selectedPathwayText,
        certificationDate: certificationDate
      };
      const encodedCertificateInfo =
        encodeURIComponent(LZString.compressToEncodedURIComponent(JSON.stringify(certificateInfo)));
      const verificationLink =
        `https://fitness.agroparistech.fr/fitness2/lectures/quiz-creator-tool-online/verify-certificate-authenticity.html?data=${encodedCertificateInfo}`;

      // Fetch the base certificate PDF
      const url = 'images/certificate-of-completion-fitness-2.pdf';
      const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
      const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);

      // Embed the Helvetica font
      const helveticaFont = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

      // Get the first page of the document
      const page = pdfDoc.getPage(0);

      // Define font sizes and text positions
      const fontSize = 24;
      const pageWidth = page.getWidth();

      // Center the fullName text
      const fullName = `${firstName} ${lastName}`;
      const nameTextWidth = helveticaFont.widthOfTextAtSize(fullName, fontSize);
      const nameX = 355 - nameTextWidth / 2;
      const nameY = 300;

      page.drawText(fullName, {
        x: nameX,
        y: nameY,
        size: fontSize,
        font: helveticaFont,
        color: PDFLib.rgb(0, 0, 0)
      });

      // Center the pathway text
      const pathwayTextWidth = helveticaFont.widthOfTextAtSize(selectedPathwayText, fontSize / 2);
      const pathwayX = 355 - pathwayTextWidth / 2;
      const pathwayY = 220;

      page.drawText(selectedPathwayText, {
        x: pathwayX,
        y: pathwayY,
        size: fontSize / 2,
        font: helveticaFont,
        color: PDFLib.rgb(0, 0, 0)
      });

      // Draw the verification instruction text
      const instructionText = "Scan to verify certificate authenticity.";
      const instructionTextWidth = helveticaFont.widthOfTextAtSize(instructionText, 14);
      const instructionX = pageWidth / 2 - instructionTextWidth / 2;
      const instructionY = 180;

      page.drawText(instructionText, {
        x: instructionX,
        y: instructionY,
        size: 14,
        font: helveticaFont,
        color: PDFLib.rgb(0, 0, 0)
      });

      // Generate a larger QR code for the verification link
      const qr = new QRious({
        value: verificationLink,
        size: 150 // Increase size for better scan visibility
      });

      // Convert QR code to image bytes and embed it into the PDF
      const qrImageBytes = qr.toDataURL().split(",")[1];
      const qrImage = await pdfDoc.embedPng(qrImageBytes);

      // Adjust position and size on the PDF without additional scaling
      page.drawImage(qrImage, {
        x: instructionX - 35, // Adjust X for centering based on new size
        y: instructionY - 150, // Adjust Y position for the larger QR
        width: qrImage.width, // Directly use the generated size
        height: qrImage.height
      });

      // Serialize the PDF document to bytes
      const pdfBytes = await pdfDoc.save();

      // Download the PDF file
      const blob = new Blob([pdfBytes], {
        type: 'application/pdf'
      });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `${firstName}_${lastName}_Certificate.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>

</html>
