<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/fitness/lectures/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link rel="stylesheet" href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/font-awesome-4-7-0.min.css">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness.css" rel="stylesheet">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness2.css" rel="stylesheet">

  <style>
    .container {
      max-width: 600px;
      width: 90%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
    }

    .welcome-message {
      font-size: 1.8em;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h2 {
      color: #00796b;
      font-size: 1.6em;
      margin-bottom: 10px;
    }

    h3 {
      color: #555;
      font-size: 1.4em;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #profile-content p,
    #assessmentList li {
      font-size: 1.1em;
      margin: 5px 0;
    }

    #assessmentList {
      list-style: none;
      padding-left: 0;
    }

    .no-info {
      color: #888;
      font-style: italic;
      font-size: 1.1em;
    }
  </style>
</head>

<body>

  <main-header></main-header>

  <div class="container">
    <div class="welcome-message txt-orange-fitness">Welcome to your profile overview.</div>
    <div>
      <label for="encodedDataInput">Paste your encoded profile identifier:</label>

      <input type="text" id="encodedDataInput" placeholder="Enter encoded data here"
        style="width: 100%; padding: 10px; margin: 15px 0;">
      <button onclick="loadProfileData()" style="padding: 10px 20px; font-size: 1em;">Load Profile</button>
      <label for="encodedDataInput">Once your information is loaded, you are 'connected,' allowing you to take
        assessments,
        with all your information saved automatically. To receive your first encoded profile identifier, you must
        complete your first assessment. After each subsequent assessment, this identifier will be updated and displayed
        at the end
        of your assessment results file.</label>
    </div>

    <div id="profile-content">
      <h2>Profile Information</h2>
      <p id="userName" class="no-info">Loading...</p>
      <p id="userEmail" class="no-info">Loading...</p>
      <h3>Assessments History</h3>
      <ul id="assessmentList" class="no-info">Loading...</ul>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script>
    function loadProfileData() {
      // Get the encoded data from the input field
      const encodedProfileInfo = document.getElementById("encodedDataInput").value.trim();

      // Check if input is provided
      if (!encodedProfileInfo) {
        alert("Please enter the encoded data.");
        return;
      }

      // Clear previous data
      document.getElementById("userName").textContent = "Loading...";
      document.getElementById("userEmail").textContent = "Loading...";
      document.getElementById("assessmentList").innerHTML = "Loading...";

      // Attempt to decompress and parse the encoded data
      try {
        const decompressedData = LZString.decompressFromEncodedURIComponent(encodedProfileInfo);

        // If decompression fails, show an error
        if (!decompressedData) throw new Error("Invalid encoded data.");

        const profileInfo = JSON.parse(decompressedData);

        // Display user profile information if valid
        document.getElementById("userName").textContent = `Name: ${profileInfo.firstName} ${profileInfo.lastName}`;
        document.getElementById("userEmail").textContent = `Email: ${profileInfo.email}`;

        // Display assessment history
        const assessmentList = document.getElementById("assessmentList");
        assessmentList.innerHTML = ''; // Clear loading text
        if (profileInfo.assessmentMap && Object.keys(profileInfo.assessmentMap).length > 0) {
          Object.values(profileInfo.assessmentMap).forEach(assessment => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${assessment.name}</strong> - Success Rate: ${assessment.successRate} - 
            <a href="${assessment.quizUrl}" target="_blank">View Quiz</a>`;
            assessmentList.appendChild(li);
          });
        } else {
          assessmentList.innerHTML = '<li class="no-info">No assessment history available.</li>';
        }

      } catch (error) {
        // Display error message if data is invalid
        console.error("Error loading profile data:", error);
        document.getElementById("profile-content").innerHTML =
          "<p class='no-info'>No valid profile information available. Please check the encoded data and try again.</p>";
      }
    }
  </script>


  <main-footer></main-footer>

  <link rel="stylesheet" href="modifyLectures/assets/bootstrap/css/bootstrap.min.css" />
  <script src="src/js/google_translate_plugin.js"></script>
  <script src="src/js/header.js"></script>
  <script src="src/js/footer.js"></script>
</body>

</html>
