<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/fitness/lectures/favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link rel="stylesheet" href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/font-awesome-4-7-0.min.css">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness.css" rel="stylesheet">
  <link href="https://fitness.agroparistech.fr/fitness2/lectures/src/css/fitness2.css" rel="stylesheet">

  <style>
    .container {
      max-width: 600px;
      width: 90%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
    }

    .welcome-message {
      font-size: 1.8em;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h2 {
      color: #00796b;
      font-size: 1.6em;
      margin-bottom: 10px;
    }

    h3 {
      color: #555;
      font-size: 1.4em;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #profile-content p,
    #assessmentList li {
      font-size: 1.1em;
      margin: 5px 0;
    }

    #assessmentList {
      list-style: none;
      padding-left: 0;
    }

    .no-info {
      color: #888;
      font-style: italic;
      font-size: 1.1em;
    }
  </style>
</head>

<body>

  <main-header></main-header>

  <div class="container">
    <div class="welcome-message txt-orange-fitness">Welcome to your profile overview.</div>
    <div>
      <label for="encodedDataInput">Paste your encoded profile identifier:</label>
      <input type="text" id="encodedDataInput" placeholder="Enter encoded profile identifier here"
        style="width: 100%; padding: 10px; margin: 15px 0;">
      <div style="display: flex; justify-content: space-between;">
        <button onclick="loadProfileData()" class="btn-default" style="padding: 10px 20px; font-size: 1em;">Log
          in</button>
        <button onclick="confirmLogout()" class="btn-default" style="padding: 10px 20px; font-size: 1em;">Log
          out</button>
      </div>
      <label for="encodedDataInput">Once your information is loaded, you will be 'logged in,' which will enable you to
        take assessments. To receive your first encoded profile identifier, complete your first assessment. This
        identifier will update after each assessment.</label>
    </div>


    <div id="profile-content">
      <h2>Profile Information</h2>
      <p id="userName" class="no-info">Loading...</p>
      <p id="userEmail" class="no-info">Loading...</p>
      <h3>Assessments History</h3>
      <ul id="assessmentList" class="no-info">Loading...</ul>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script>
    const DB_NAME = "FitnessProfileDB";
    const STORE_NAME = "ProfileStore";

    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          db.createObjectStore(STORE_NAME, {
            keyPath: "id"
          });
        };
      });
    }

    // Confirm log out action
    function confirmLogout() {
      if (confirm("Are you sure you want to log out? This will clear your stored data.")) {
        logout();
      }
    }

    // Log out: clear IndexedDB, local storage, and page content
    async function logout() {
      // Clear IndexedDB data
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        store.delete("profile");

        console.log("Profile data cleared from IndexedDB");
      } catch (error) {
        console.error("Error clearing data from IndexedDB:", error);
      }

      // Clear additional local storage items
      localStorage.removeItem("learnerData");
      localStorage.removeItem("fitness2ProfileInfoUrl");
      console.log("Additional data cleared from local storage");

      // Clear input field and profile display
      document.getElementById("encodedDataInput").value = "";
      document.getElementById("userName").textContent = "Name: Not available";
      document.getElementById("userEmail").textContent = "Email: Not available";
      document.getElementById("assessmentList").innerHTML =
        '<li class="no-info">No assessment history available.</li>';
    }


    // Store profile data in IndexedDB
    async function storeProfileData(encodedData, profileInfo) {
      const db = await initDB();
      const transaction = db.transaction(STORE_NAME, "readwrite");
      const store = transaction.objectStore(STORE_NAME);
      store.put({
        id: "profile",
        encodedData,
        profileInfo
      });
    }

    // Retrieve profile data from IndexedDB
    async function getProfileData() {
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get("profile");

        return new Promise((resolve, reject) => {
          request.onsuccess = () => {
            console.log("Data retrieved from IndexedDB:", request.result); // Debugging log
            resolve(request.result);
          };
          request.onerror = () => {
            console.error("Error retrieving data from IndexedDB:", request.error); // Debugging log
            reject(request.error);
          };
        });
      } catch (error) {
        console.error("Error initializing IndexedDB:", error); // Debugging log
      }
    }

    // Load profile data either from input or IndexedDB
    async function loadProfileData() {
      const encodedDataInput = document.getElementById("encodedDataInput");
      let encodedProfileInfo = encodedDataInput.value.trim();

      // If no input is provided, attempt to retrieve from IndexedDB
      if (!encodedProfileInfo) {
        try {
          const storedData = await getProfileData();

          if (storedData && storedData.encodedData) {
            // Only set the input field and display profile data if `encodedData` is valid
            encodedDataInput.value = storedData.encodedData;
            displayProfileData(storedData.profileInfo);
            console.log("Profile data displayed from IndexedDB"); // Debugging log
          } else {
            // Clear the input field to show the placeholder if no valid data is found
            encodedDataInput.value = "";
            console.log("No valid data found in IndexedDB"); // Debugging log
          }
        } catch (error) {
          console.error("Error loading profile data on page load:", error); // Debugging log
        }
      }

      // If encodedProfileInfo is still empty after the above checks, alert and exit
      if (!encodedProfileInfo) {
        alert("Please enter the encoded data.");
        return;
      }

      // Process and display the profile data from the input
      try {
        const decompressedData = LZString.decompressFromEncodedURIComponent(encodedProfileInfo);
        if (!decompressedData) throw new Error("Invalid encoded data.");

        const profileInfo = JSON.parse(decompressedData);
        displayProfileData(profileInfo);

        // Store encoded data and profile information in IndexedDB for future access
        storeProfileData(encodedProfileInfo, profileInfo);

      } catch (error) {
        console.error("Error loading profile data:", error);
        document.getElementById("profile-content").innerHTML =
          "<p class='no-info'>No valid profile information available. Please check the encoded data and try again.</p>";
      }
    }


    // Display profile information on the page
    function displayProfileData(profileInfo) {
      // Check if profileInfo exists and has the necessary properties
      const userNameElement = document.getElementById("userName");
      const userEmailElement = document.getElementById("userEmail");
      const assessmentList = document.getElementById("assessmentList");

      if (profileInfo && profileInfo.firstName && profileInfo.lastName) {
        userNameElement.textContent = `Name: ${profileInfo.firstName} ${profileInfo.lastName}`;
      } else {
        userNameElement.textContent = "Name: Not available";
      }

      if (profileInfo && profileInfo.email) {
        userEmailElement.textContent = `Email: ${profileInfo.email}`;
      } else {
        userEmailElement.textContent = "Email: Not available";
      }

      // Display assessment history if available
      assessmentList.innerHTML = ''; // Clear any existing content
      if (profileInfo && profileInfo.assessmentMap && Object.keys(profileInfo.assessmentMap).length > 0) {
        Object.values(profileInfo.assessmentMap).forEach(assessment => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${assessment.name}</strong> - Success Rate: ${assessment.successRate} -
    <a href="${assessment.quizUrl}" target="_blank">View Quiz</a>`;
          assessmentList.appendChild(li);
        });
      } else {
        assessmentList.innerHTML = '<li class="no-info">No assessment history available.</li>';
      }
    }

    // Attempt to load profile data from IndexedDB on page load
    document.addEventListener("DOMContentLoaded", async () => {
      const storedData = await getProfileData();
      if (storedData && storedData.encodedData) {
        // Only set the input field and display profile data if `encodedData` is valid
        document.getElementById("encodedDataInput").value = storedData.encodedData;
        displayProfileData(storedData.profileInfo);
      } else {
        // Clear the input field to show the placeholder if no valid data is found
        document.getElementById("encodedDataInput").value = "";
      }
    });
  </script>



  <main-footer></main-footer>

  <link rel="stylesheet" href="modifyLectures/assets/bootstrap/css/bootstrap.min.css" />
  <script src="src/js/google_translate_plugin.js"></script>
  <script src="src/js/header.js"></script>
  <script src="src/js/footer.js"></script>
</body>

</html>
