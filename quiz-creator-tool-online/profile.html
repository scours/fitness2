    // Initialize IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          db.createObjectStore(STORE_NAME, {
            keyPath: "id"
          });
        };
      });
    }

    function displayPathways(profileInfo) {
      const profileContent = document.getElementById("profile-content");

      // Sort pathways to ensure consistent display order
      const orderedPathways = ["RnD_Manager_Basic", "RnD_Manager_Advanced", "Quality_Manager_Basic",
        "Quality_Manager_Advanced", "Production_Line_Worker_Basic",
        "Production_Manager_Basic", "Production_Manager_Advanced"
      ];

      orderedPathways.forEach((pathwayKey) => {
        const pathway = pathways[pathwayKey];
        const pathwayContainer = document.createElement("div");
        pathwayContainer.style.marginBottom = "20px";
        pathwayContainer.style.padding = "10px";
        pathwayContainer.style.borderTop = "2px solid orange";

        // Pathway Header
        const pathwayHeader = document.createElement("h3");
        pathwayHeader.textContent = pathway.pathwayName;

        // Pathway Information Link
        const pathwayLink = document.createElement("a");
        pathwayLink.href = pathwayUrls[pathwayKey];
        pathwayLink.textContent = "For more information on this pathway, click here";

        // Calculate overall success rate for mandatory assessments
        let completedMandatoryAssessments = 0;
        let totalMandatoryAssessments = 0;

        pathway.topics.forEach((topic) => {
          topic.lectures.forEach((lecture) => {
            if (lecture.mandatory) {
              totalMandatoryAssessments++;
              const assessment = profileInfo.assessmentMap[lecture.id];
              if (assessment) {
                completedMandatoryAssessments += parseFloat(assessment.successRate.replace('%', '')) / 100;
              }
            }
          });
        });

        const overallSuccessRate = totalMandatoryAssessments > 0 ?
          (completedMandatoryAssessments / totalMandatoryAssessments) * 100 :
          0;

        // Success Rate and Explanation Text
        const successText = document.createElement("p");
        successText.innerHTML =
          `<strong>Your overall success for this pathway: ${overallSuccessRate.toFixed(2)}%</strong>`;

        const explanationText = document.createElement("p");
        explanationText.textContent = `Your overall success considers only the mandatory assessments for this pathway. To
    request a certificate from an author for a pathway, an overall success rate above 65 % is required.`;

        pathwayContainer.appendChild(pathwayHeader);
        pathwayContainer.appendChild(pathwayLink);
        pathwayContainer.appendChild(successText);
        pathwayContainer.appendChild(explanationText);

        // Topic and lecture details with assessment status and mandatory/elective label
        pathway.topics.forEach((topic) => {
          const topicContainer = document.createElement("div");
          const topicHeader = document.createElement("h4");
          topicHeader.textContent = topic.topicName;
          topicContainer.appendChild(topicHeader);

          topic.lectures.forEach((lecture) => {
            const lectureContainer = document.createElement("div");
            const mandatoryStatus = lecture.mandatory ? "Mandatory" : "Elective";
            const assessment = profileInfo.assessmentMap[lecture.id];

            // Display Lecture Details with Status and Assessment (if completed)
            if (assessment) {
              lectureContainer.innerHTML = `${lecture.name} - ${mandatoryStatus} - <a href="${assessment.quizUrl}"
      target="_blank">Assessment completed: ${assessment.successRate}</a>`;
            } else {
              lectureContainer.textContent = `${lecture.name} - ${mandatoryStatus}`;
            }

            topicContainer.appendChild(lectureContainer);
          });

          pathwayContainer.appendChild(topicContainer);
        });

        profileContent.appendChild(pathwayContainer);
      });
    }

    // Confirm log out action
    function confirmLogout() {
      if (confirm("Are you sure you want to log out? This will clear your stored data.")) {
        logout();
      }
    }

    // Log out: clear IndexedDB, local storage, and page content
    async function logout() {
      // Clear IndexedDB data
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        store.delete("profile");

        console.log("Profile data cleared from IndexedDB");
      } catch (error) {
        console.error("Error clearing data from IndexedDB:", error);
      }

      // Clear additional local storage items
      localStorage.removeItem("learnerData");
      localStorage.removeItem("fitness2ProfileInfoUrl");
      console.log("Additional data cleared from local storage");

      // Clear input field and profile display
      document.getElementById("encodedDataInput").value = "";
      document.getElementById("userName").textContent = "Name: Not available";
      document.getElementById("userEmail").textContent = "Email: Not available";

    }


    // Store profile data in IndexedDB
    async function storeProfileData(encodedData, profileInfo) {
      const db = await initDB();
      const transaction = db.transaction(STORE_NAME, "readwrite");
      const store = transaction.objectStore(STORE_NAME);
      store.put({
        id: "profile",
        encodedData,
        profileInfo
      });
    }

    // Retrieve profile data from IndexedDB
    async function getProfileData() {
      try {
        const db = await initDB();
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get("profile");

        return new Promise((resolve, reject) => {
          request.onsuccess = () => {
            console.log("Data retrieved from IndexedDB:", request.result); // Debugging log
            resolve(request.result);
          };
          request.onerror = () => {
            console.error("Error retrieving data from IndexedDB:", request.error); // Debugging log
            reject(request.error);
          };
        });
      } catch (error) {
        console.error("Error initializing IndexedDB:", error); // Debugging log
      }
    }

    // Load profile data either from input or IndexedDB
    async function loadProfileData() {
      const encodedDataInput = document.getElementById("encodedDataInput");
      let encodedProfileInfo = encodedDataInput.value.trim();

      // If no input is provided, attempt to retrieve from IndexedDB
      if (!encodedProfileInfo) {
        try {
          const storedData = await getProfileData();

          if (storedData && storedData.encodedData) {
            // Only set the input field and display profile data if `encodedData` is valid
            encodedDataInput.value = storedData.encodedData;
            displayProfileData(storedData.profileInfo);
            console.log("Profile data displayed from IndexedDB"); // Debugging log
          } else {
            // Clear the input field to show the placeholder if no valid data is found
            encodedDataInput.value = "";
            console.log("No valid data found in IndexedDB"); // Debugging log
            document.getElementById("pathwayList").innerHTML = "No pathways available.";

          }
        } catch (error) {
          console.error("Error loading profile data on page load:", error); // Debugging log
        }
      }

      // If encodedProfileInfo is still empty after the above checks, alert and exit
      if (!encodedProfileInfo) {
        alert("Please enter the encoded data.");
        return;
      }

      // Process and display the profile data from the input
      try {
        const decompressedData = LZString.decompressFromEncodedURIComponent(encodedProfileInfo);
        if (!decompressedData) throw new Error("Invalid encoded data.");

        const profileInfo = JSON.parse(decompressedData);
        displayProfileData(profileInfo);

        // Store encoded data and profile information in IndexedDB for future access
        storeProfileData(encodedProfileInfo, profileInfo);

      } catch (error) {
        console.error("Error loading profile data:", error);
        document.getElementById("profile-content").innerHTML =
          "<p class='no-info'>No valid profile information available. Please check the encoded data and try again.</p>";
      }
    }


    // Display profile information on the page
    function displayProfileData(profileInfo) {
      const profileContent = document.getElementById("profile-content");

      // Check if profileInfo exists and is valid
      if (!profileInfo || typeof profileInfo !== 'object' || Object.keys(profileInfo).length === 0) {
        console.error("No valid profile information available. Please check the encoded data and try again.");
        profileContent.innerHTML =
          `<p class='no-info'>No valid profile information available. Please check the encoded data
        and
        try again. < /p>`;
        return;
      }

      // Update user name and email, displaying 'Not available' if data is missing
      const userNameElement = document.getElementById("userName");
      const userEmailElement = document.getElementById("userEmail");


      userNameElement.textContent = profileInfo.firstName && profileInfo.lastName ?
        `Name: ${profileInfo.firstName} ${profileInfo.lastName}` :
        "Name: Not available";

      userEmailElement.textContent = profileInfo.email ?
        `Email: ${profileInfo.email}` :
        "Email: Not available";

      // Proceed with displaying pathways if profileInfo is valid
      displayPathways(profileInfo);

    }


    // Attempt to load profile data from IndexedDB on page load
    document.addEventListener("DOMContentLoaded", async () => {
      const storedData = await getProfileData();
      if (storedData && storedData.encodedData) {
        // Only set the input field and display profile data if `encodedData` is valid
        document.getElementById("encodedDataInput").value = storedData.encodedData;
        displayProfileData(storedData.profileInfo);
      } else {
        // Clear the input field to show the placeholder if no valid data is found
        document.getElementById("encodedDataInput").value = "";
      }
    });
  </script>
